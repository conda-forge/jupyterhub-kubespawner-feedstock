{% set name = "jupyterhub-kubespawner" %}
{% set version = "7.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d02d3f2eea9c3e22ca831c76b6bc2341982b9555bd84f3d075021195efbd0822

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - escapism
    - jinja2
    - jupyterhub >=4.0.0
    - kubernetes_asyncio >=24.2.3
    - python-slugify
    - pyyaml
    - traitlets
    - urllib3

test:
  requires:
    - python {{ python_min }}
  imports:
    - kubespawner

about:
  home: https://github.com/jupyterhub/kubespawner
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Kubernetes spawner for JupyterHub

extra:
  recipe-maintainers:
    - consideratio
    - dhirschfeld
    - manics
